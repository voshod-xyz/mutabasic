[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mutabasic"
version = "1.0.0"
description = "A small self-modifying BASIC interpreter"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mutabasic_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
